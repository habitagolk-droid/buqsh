name: Build Android Release APK

on:
  push:
    branches: [main, ui2code-complete-implementation]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-apk:
    name: Build Release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
          cache-key: flutter-3.50.0
          pub-cache: true

      - name: Verify toolchain
        run: |
          flutter --version
          java -version

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        run: >-
          timeout 5m flutter test --reporter expanded
          test/cashier_login_response_test.dart
          test/cashier_session_info_test.dart
          test/history_formatting_test.dart
          test/wallet_test.dart

      # flutter_inappwebview_android 1.1.3 still references the legacy
      # proguard-android.txt, which AGP 9 rejects during project evaluation.
      - name: Patch legacy WebView ProGuard filename
        run: |
          WEBVIEW_GRADLE="$HOME/.pub-cache/hosted/pub.dev/flutter_inappwebview_android-1.1.3/android/build.gradle"
          test -f "$WEBVIEW_GRADLE"
          sed -i 's/proguard-android\.txt/proguard-android-optimize.txt/g' "$WEBVIEW_GRADLE"

      - name: Patch legacy app_settings Gradle script
        run: |
          APP_SETTINGS_GRADLE="$HOME/.pub-cache/hosted/pub.dev/app_settings-5.2.0/android/build.gradle"
          test -f "$APP_SETTINGS_GRADLE"
          sed -i "/apply plugin: 'kotlin-android'/d; s/compileSdkVersion 33/compileSdk 36/; s/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g" "$APP_SETTINGS_GRADLE"
          sed -i '/^[[:space:]]*kotlinOptions {[[:space:]]*$/,+2d' "$APP_SETTINGS_GRADLE"

      - name: Normalize cached Flutter plugin Gradle scripts for AGP 9
        run: |
          find "$HOME/.pub-cache/hosted/pub.dev" -path '*/android/build.gradle' -type f -print0 |
            while IFS= read -r -d '' GRADLE_FILE; do
              sed -i -E \
                "/^[[:space:]]*(id|apply plugin:).*([\"']kotlin-android[\"']|[\"']org\.jetbrains\.kotlin\.android[\"']).*$/d; \
                 s/compileSdkVersion/compileSdk/g; \
                 s/compileSdk[[:space:]]+flutter\.compileSdkVersion/compileSdk 36/g; \
                 s/compileSdk[[:space:]]*=[[:space:]]*flutter\.compileSdkVersion/compileSdk = 36/g; \
                 s/flutter\.compileSdk(Version)?/36/g; \
                 s/compileSdk[[:space:]]*=?[[:space:]]*[0-9]+/compileSdk 36/g; \
                 s/JavaVersion\.VERSION_1_8/JavaVersion.VERSION_17/g; \
                 s/JavaVersion\.VERSION_11/JavaVersion.VERSION_17/g; \
                 /^[[:space:]]*kotlinOptions\.jvmTarget[[:space:]]*=.*$/d" \
                "$GRADLE_FILE"
              perl -0pi -e 's/\n[ \t]*kotlinOptions\s*\{.*?\n[ \t]*\}\s*/\n/gs' "$GRADLE_FILE"
            done

      # The repository intentionally does not track gradlew/gradle-wrapper.jar.
      # Generate the wrapper from the Gradle version declared by the project.
      - name: Set up Gradle 9.3.1 and generate wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Gradle wrapper
        run: |
          gradle -p android wrapper --gradle-version 9.3.1 --distribution-type bin
          chmod +x android/gradlew

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: buqsh-android-release-apk-${{ github.sha }}
          if-no-files-found: error
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
